<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>서울숲 모바일 화면</title>
<meta name="description" content="서울숲, 머무는 숲 — 이용자 화면을 휴대폰에서 연 모습 (발표용)" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f5f45'/><path d='M16 6l7 11h-4l5 8H8l5-8H9z' fill='%23fff'/></svg>" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  /* Presentation stage: a phone mockup that runs the real citizen screen (needs/tour.html) inside an iframe. */
  :root{
    --stage:#0d1512; --stage2:
    #16241e; --ink:#eef3ef; --mute:#93a69b; --accent:#7fd3a6;
    --body:#111; --bezel:#050505;
    --pw:393px; --ph:852px;            /* phone screen size in CSS px */
    --sb:47px; --hb:30px;               /* status bar / home indicator heights */
    --scale:1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 800px at 50% 40%,var(--stage2),var(--stage));
    color:var(--ink);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;
    overflow:hidden;display:flex;align-items:center;justify-content:center;gap:56px;
  }
  .caption{max-width:340px}
  .caption .kicker{font-size:12px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
  .caption h1{font-size:34px;line-height:1.25;font-weight:700;margin:12px 0 14px;letter-spacing:-.02em}
  .caption p{font-size:15px;line-height:1.65;color:var(--mute)}
  .scn{margin-top:28px;display:flex;flex-wrap:wrap;gap:8px}
  .scn button{
    font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 14px;cursor:pointer;
  }
  .scn button:hover{background:rgba(255,255,255,.12)}
  .scn button[aria-pressed="true"]{background:var(--accent);color:#08251a;border-color:var(--accent);font-weight:600}
  .hint{margin-top:18px;font-size:12px;color:#61756a}

  /* phone */
  /* zoom (not transform:scale): the browser lays the phone out at the target size, so the map inside
     isn't re-rasterised through a scaled layer on every frame — smoother panning, sharper text. */
  .phone-wrap{flex:none;zoom:var(--scale)}
  .phone{
    width:calc(var(--pw) + 28px);height:calc(var(--ph) + 28px);
    position:relative;border-radius:68px;padding:14px;
    background:linear-gradient(145deg,#3a3f3d,#1a1c1b 40%,#2c302e);
    box-shadow:0 0 0 2px #0b0b0b,0 40px 90px rgba(0,0,0,.55),0 12px 30px rgba(0,0,0,.4),inset 0 0 0 1.5px rgba(255,255,255,.08);
  }
  /* side buttons */
  .phone::before,.phone::after{content:"";position:absolute;width:4px;border-radius:2px;background:#2a2e2c}
  .phone::before{left:-4px;top:180px;height:64px;box-shadow:0 84px 0 #2a2e2c}
  .phone::after{right:-4px;top:230px;height:100px}
  .screen{
    width:var(--pw);height:var(--ph);border-radius:54px;overflow:hidden;position:relative;
    background:#08110d;box-shadow:0 0 0 6px var(--bezel);   /* dark, so zoom rounding never shows a light hairline */
    display:flex;flex-direction:column;
  }
  .status{
    height:var(--sb);flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:6px 34px 0 44px;font-size:16px;font-weight:600;color:#111;background:var(--sbg,#fff);
    transition:background .3s,color .3s;
  }
  .status.dark{color:#fff}
  .status .icons{display:flex;gap:6px;align-items:center}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:3}
  iframe{flex:1;width:calc(100% + 1px);margin-right:-1px;border:0;display:block;background:#08110d}
  .home{height:var(--hb);flex:none;display:flex;align-items:center;justify-content:center;background:var(--sbg,#fff);transition:background .3s}
  .home i{width:136px;height:5px;border-radius:3px;background:#111;opacity:.85}
  .home.dark i{background:#fff}

  /* back to dashboard: page corner, outside the phone */
  .back{
    position:fixed;top:20px;left:20px;display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:600;color:var(--mute);text-decoration:none;
    padding:8px 14px 8px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);
  }
  .back:hover{color:var(--ink);background:rgba(255,255,255,.1)}
  body.clean .caption,body.clean .back{display:none}
  @media (max-width:820px){ .caption{display:none} body{gap:0} }
</style>
</head>
<body>
  <a class="back" id="back" href="./needs/tour.html" title="큰 화면 이용자 화면으로 돌아가기">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>이용자 화면
  </a>
  <aside class="caption">
    <div class="kicker">Seoul Forest · Mobile</div>
    <h1>서울숲,<br>폰에서 여는<br>나에게 맞는 길</h1>
    <p>공원에 온 사람이 휴대폰으로 보는 화면입니다. 하고 싶은 일과 같이 온 사람을 고르면 지금 날씨·붐빔에 맞는 갈 곳과 산책 코스를 알려 줍니다.</p>
    <div class="scn" role="group" aria-label="날씨 상황">
      <button data-s="" aria-pressed="true">평소</button>
      <button data-s="heat" aria-pressed="false">폭염</button>
      <button data-s="dust" aria-pressed="false">미세먼지</button>
      <button data-s="rain" aria-pressed="false">호우</button>
      <button data-s="cold" aria-pressed="false">한파</button>
    </div>
    <div class="hint">H 설명·버튼 숨기기 · R 처음으로 · F 전체 화면</div>
  </aside>

  <div class="phone-wrap">
    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <div class="status" id="status">
          <span id="clock">9:41</span>
          <span class="icons" aria-hidden="true">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.8 6.8 0 0 0 8 4a6.8 6.8 0 0 0-4.6 1.8l1.2 1.3A5 5 0 0 1 8 5.8Zm0 3.5c-.5 0-1 .2-1.3.5L8 11.2l1.3-1.4c-.3-.3-.8-.5-1.3-.5Z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="currentColor" opacity=".45"/></svg>
          </span>
        </div>
        <iframe id="app" title="서울숲 이용자 화면" src="about:blank" allow="geolocation"></iframe>
        <div class="home" id="home"><i></i></div>
      </div>
    </div>
  </div>

<script>
(function(){
  var root=document.documentElement, frame=document.getElementById('app');
  var PW=393+28, PH=852+28;

  // Fit the phone to the window height (presentation screens vary).
  function fit(){
    var s=Math.min((innerHeight-48)/PH,(innerWidth-32)/PW,1.15);
    root.style.setProperty('--scale',Math.max(.35,s).toFixed(3));
  }
  addEventListener('resize',fit); fit();

  // Live clock in the status bar.
  function tick(){var d=new Date();document.getElementById('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
  tick(); setInterval(tick,15000);

  // Match status bar / home bar colour to the app's background so it looks like a native screen.
  function syncBars(){
    try{
      var doc=frame.contentDocument; if(!doc||!doc.body) return;
      var el=doc.elementFromPoint(doc.documentElement.clientWidth/2,2)||doc.body;
      var bg='rgba(0, 0, 0, 0)';
      while(el&&(bg==='rgba(0, 0, 0, 0)'||bg==='transparent')){bg=getComputedStyle(el).backgroundColor;el=el.parentElement;}
      if(bg==='rgba(0, 0, 0, 0)'||bg==='transparent') bg=getComputedStyle(doc.body).backgroundColor;
      var m=bg.match(/\d+(\.\d+)?/g)||[255,255,255];
      var lum=(0.299*m[0]+0.587*m[1]+0.114*m[2]);
      root.style.setProperty('--sbg',bg);
      document.getElementById('status').classList.toggle('dark',lum<140);
      document.getElementById('home').classList.toggle('dark',lum<140);
    }catch(e){}
  }
  // Re-check only when something may have changed (load, a tap inside the phone) — not on a timer,
  // because reading styles inside the frame forces it to recalculate layout and causes hitches.
  var syncT=0;
  function syncSoon(){ clearTimeout(syncT); syncT=setTimeout(syncBars,600); }
  frame.addEventListener('load',function(){
    syncBars(); setTimeout(syncBars,800);
    try{ frame.contentDocument.addEventListener('click',syncSoon,true); }catch(e){}
  });

  // Weather scenario buttons -> tour.html?wx=heat|dust|rain|cold (see tour.js "시연용").
  // _=timestamp makes the phone always load the latest pushed tour.html instead of a cached copy.
  function src(s){ return './needs/tour.html?'+(s?'wx='+s+'&':'')+'_='+Date.now(); }
  var cur='';
  frame.src=src('');

  // Links inside the phone that leave the user screen (e.g. tour's 「돌아가기」) must open in the whole
  // window, not inside the phone. Intercept clicks in the frame; as a fallback, if the frame still
  // ends up on another page, move the whole window there.
  function goDash(url){ location.href=url; }
  function guardFrame(){
    var w,doc; try{ w=frame.contentWindow; doc=w.document; }catch(e){ return; }
    if(!doc||w.location.href==='about:blank') return;
    if(!/\/needs\/tour\.html/.test(w.location.pathname)){ goDash(w.location.href); return; }
    if(doc.__ndGuard) return; doc.__ndGuard=true;
    // Phone-only tweaks to the user screen (tour.html itself is untouched):
    // - hide its 「돌아가기」: the page corner already has 「‹ 이용자 화면」
    // - drop backdrop blur: the glass panels are 72–82% opaque so it barely shows, but re-blurring
    //   the map behind 13 panels on every pan frame is the main GPU cost → smoother map.
    var st=doc.createElement('style');
    //   Without blur the map would show through the sheet, so the sheet gets the same tone, opaque.
    //   Page background dark too: at fractional zoom the map can end a hair short of the edge.
    st.textContent='.tr-link.tr-back{display:none!important}'+
      'html,body{background:#08110d!important}'+
      '*,*::before,*::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}'+
      '.tr-panel{background:linear-gradient(180deg,#0e1813,#08100c)!important}';
    doc.head.appendChild(st);
    doc.addEventListener('click',function(e){
      var a=e.target.closest&&e.target.closest('a[href]'); if(!a) return;
      var u=new URL(a.getAttribute('href'),w.location.href);
      if(u.origin===w.location.origin&&/\/needs\/tour\.html$/.test(u.pathname)) return; // stays in the user screen
      if(a.target==='_blank') return;
      e.preventDefault(); goDash(u.href);
    },true);
  }
  frame.addEventListener('load',guardFrame);

  // Back to the user screen we came from: needs/mobile-open.js saved its URL in sessionStorage
  // when 「모바일로 보기」 was pressed. Without it, the link's href (./needs/tour.html) is used.
  // (history.go is unreliable here because the iframe adds an unknown number of history entries.)
  document.getElementById('back').addEventListener('click',function(e){
    var s=null; try{ s=JSON.parse(sessionStorage.getItem('nd-mobile-return')||'null'); }catch(err){}
    if(s&&s.url){ e.preventDefault(); location.href=s.url; }
  });
  function go(s){
    cur=s;
    try{ frame.contentWindow.location.replace(src(s)); }catch(e){ frame.src=src(s); }  // replace: no extra history entry
    document.querySelectorAll('.scn button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.s===s));});
  }
  document.querySelectorAll('.scn button').forEach(function(b){b.addEventListener('click',function(){go(b.dataset.s);});});

  addEventListener('keydown',function(e){
    if(e.target!==document.body) return;
    var k=e.key.toLowerCase();
    if(k==='h') document.body.classList.toggle('clean');
    else if(k==='r') go(cur);
    else if(k==='f'){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){}); }
  });
})();
</script>
</body>
</html>
