# 서울숲 실시간 인구 모으기 (기업과제_서울숲_스마트공원/analysis/09_live.py)
# - 15분마다 서울시 실시간 도시데이터에서 「서울숲공원」 값을 받아 live-data 가지에 저장합니다.
#   latest.json = 지금 값, history.csv = 시계열(같은 시각은 한 번만).
# - main이 아닌 live-data 가지에 쌓아 팀 커밋 기록을 어지럽히지 않습니다.
#   대시보드는 raw.githubusercontent.com/<저장소>/live-data/ 에서 읽습니다.
# - 필요한 것: 저장소 Settings → Secrets and variables → Actions 에 SEOUL_KEY (서울 열린데이터광장 인증키)
# - GitHub 정기 실행은 몇 분~수십 분 늦을 수 있고, 저장소에 60일간 활동이 없으면 멈춥니다(Actions 탭에서 다시 켜기).
name: 서울숲 실시간 인구 수집

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 정각을 피해 15분 간격 (UTC 기준이지만 간격이라 상관없음)
  workflow_dispatch: {}             # Actions 탭에서 손으로 한 번 돌리기

permissions:
  contents: write

concurrency:
  group: seoul-forest-live
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: live-data 가지 준비
        run: |
          if git fetch --depth=1 origin live-data:live-data 2>/dev/null; then
            git worktree add live live-data
          else
            git worktree add --orphan -b live-data live
          fi

      - name: 서울숲 값 받기
        env:
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
          PYTHONUTF8: "1"
        run: python 기업과제_서울숲_스마트공원/analysis/09_live.py --out live

      - name: live-data 가지에 저장
        working-directory: live
        run: |
          git add latest.json history.csv
          if git diff --cached --quiet; then echo "바뀐 값 없음"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898583+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "서울숲 실시간 인구 $(python -c 'import json;print(json.load(open("latest.json",encoding="utf-8"))["time"])')"
          git push -q origin live-data
